<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCANSKIP</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: rgba(255, 255, 255, 0.8);
      --text: #1e293b;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.2);
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --glass: rgba(255, 255, 255, 0.1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.15);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.8);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(71, 85, 105, 0.3);
      --glass: rgba(30, 41, 59, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      transition: var(--transition);
      line-height: 1.6;
      overflow-x: hidden;
      backdrop-filter: blur(20px);
    }
    .backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    .backdrop::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      opacity: 0.05;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px); background: var(--glass);
      border-bottom: 1px solid var(--border);
      padding: 20px 0; margin: -20px -20px 40px; border-radius: 0 0 var(--radius) var(--radius);
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow);
    }
    .header h1 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .search { flex: 1; margin: 0 30px; max-width: 500px; }
    .search input {
      width: 100%; padding: 14px 20px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); border-radius: 50px;
      font-size: 16px; transition: var(--transition);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .search input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1), var(--shadow-hover);
    }
    .btn {
      padding: 12px 24px; border: none; border-radius: 50px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
      backdrop-filter: blur(10px); background: var(--card);
      box-shadow: var(--shadow);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px; margin: 40px 0;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: var(--transition);
      backdrop-filter: blur(20px); box-shadow: var(--shadow);
      position: relative;
    }
    .card:hover {
      transform: translateY(-10px) scale(1.02); box-shadow: var(--shadow-hover);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      opacity: 0; transition: opacity 0.3s;
    }
    .card:hover::before { opacity: 1; }
    .thumb {
      position: relative; overflow: hidden; height: 250px;
      img {
        width: 100%; height: 100%; object-fit: cover; transition: var(--transition);
      }
    }
    .card:hover .thumb img { transform: scale(1.1); }
    .card-body { padding: 24px; position: relative; z-index: 1; }
    .title { font-weight: 600; margin-bottom: 8px; font-size: 20px; }
    .muted { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .price {
      font-size: 24px; font-weight: 700; color: var(--primary);
      margin-bottom: 16px;
    }
    .qty-controls {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      button {
        width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
        background: var(--card); color: var(--text); cursor: pointer;
        transition: var(--transition); display: flex; align-items: center; justify-content: center;
      }
      button:hover { background: var(--primary); color: white; }
      span { font-size: 16px; font-weight: 600; min-width: 30px; text-align: center; }
    }
    .sidebar {
      position: fixed; top: 0; right: -500px; width: 500px; height: 100vh;
      background: var(--card); border-left: 1px solid var(--border);
      transition: var(--transition); z-index: 1000; padding: 30px; overflow-y: auto;
      backdrop-filter: blur(20px); box-shadow: -10px 0 40px var(--shadow);
    }
    .sidebar.open { right: 0; }
    .sidebar h2 { margin-bottom: 30px; font-weight: 700; }
    .cart-item {
      display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }
    .cart-item:hover { background: var(--glass); border-radius: 8px; padding: 20px; margin: 0 -20px; }
    .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .cart-item-details { flex: 1; }
    .cart-item-title { font-weight: 600; margin-bottom: 4px; }
    .cart-item-price { color: var(--muted); font-size: 14px; }
    .cart-item-controls {
      display: flex; align-items: center; gap: 8px;
      button {
        width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
        background: var(--card); color: var(--text); cursor: pointer;
        transition: var(--transition);
      }
      button:hover { background: var(--primary); color: white; }
      span { min-width: 24px; text-align: center; font-weight: 600; }
    }
    .cart-summary {
      margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);
      div { display: flex; justify-content: space-between; margin-bottom: 8px; }
      .total { font-size: 18px; font-weight: 700; color: var(--primary); }
    }
    .coupon { margin: 20px 0; }
    .coupon input {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      background: var(--card); border-radius: 8px; margin-bottom: 8px;
      backdrop-filter: blur(10px);
    }
    .steps {
      display: flex; justify-content: center; margin: 40px 0;
      position: relative;
    }
    .steps::before {
      content: ''; position: absolute; top: 50%; left: 0; right: 0;
      height: 2px; background: var(--border); z-index: 1;
    }
    .step {
      padding: 16px 32px; background: var(--card); border: 1px solid var(--border);
      border-radius: 50px; margin: 0 16px; position: relative; z-index: 2;
      font-weight: 600; transition: var(--transition);
      backdrop-filter: blur(10px); box-shadow: var(--shadow);
    }
    .step.active {
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }
    .section { display: none; max-width: 600px; margin: 0 auto; }
    .section.active { display: block; }
    .section h2 {
      text-align: center; margin-bottom: 40px; font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .form-group { margin: 24px 0; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 16px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); border-radius: 12px;
      font-size: 16px; transition: var(--transition);
      backdrop-filter: blur(10px); box-shadow: var(--shadow);
    }
    .form-group input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1), var(--shadow-hover);
    }
    .summary {
      background: var(--card); border-radius: var(--radius); padding: 24px; margin: 30px 0;
      backdrop-filter: blur(20px); box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .summary div {
      display: flex; justify-content: space-between; margin: 12px 0;
      font-size: 16px; transition: var(--transition);
    }
    .summary div:hover { background: var(--glass); padding: 8px; border-radius: 8px; margin: 8px -8px; }
    .summary .total {
      font-weight: 700; font-size: 20px; border-top: 1px solid var(--border);
      padding-top: 16px; margin-top: 16px; color: var(--primary);
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1001; backdrop-filter: blur(20px); transition: var(--transition);
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--card); padding: 40px; border-radius: var(--radius);
      width: 90%; max-width: 500px; backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      transform: scale(0.9); transition: var(--transition);
    }
    .modal:not(.hidden) .modal-content { transform: scale(1); }
    .toast {
      position: fixed; bottom: 30px; right: 30px; background: var(--success);
      color: white; padding: 16px 24px; border-radius: 50px; opacity: 0;
      transition: var(--transition); backdrop-filter: blur(10px);
      box-shadow: var(--shadow); z-index: 1002;
      display: flex; align-items: center; gap: 12px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast:not(.show) { transform: translateY(20px); }
    .floating-btn {
      position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px;
      border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none; cursor: pointer;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; transition: var(--transition); z-index: 100;
    }
    .floating-btn:hover { transform: scale(1.1) rotate(5deg); }
    .skeleton {
      background: linear-gradient(90deg, var(--glass) 25%, rgba(255,255,255,0.1) 50%, var(--glass) 75%);
      background-size: 200% 100%; animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .success-animation {
      text-align: center; animation: bounceIn 0.6s ease-out;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (max-width: 768px) {
      .container { padding: 15px; }
      .header { flex-direction: column; gap: 20px; margin: -15px -15px 30px; }
      .search { margin: 0; max-width: none; }
      .sidebar { width: 100%; right: -100%; }
      .grid { grid-template-columns: 1fr; gap: 20px; }
      .modal-content { width: 95%; padding: 20px; }
    }
  </style>
</head>
<body data-theme="light">
  <div class="backdrop"></div>
  <button class="floating-btn" id="toggleTheme"><i class="fas fa-moon"></i></button>

  <div class="container">
    <div class="header">
      <h1><i class="fas fa-shopping-bag"></i> ScanSkip</h1>
      <div class="search">
        <input type="text" id="searchInput" placeholder="Search luxury products...">
      </div>
      <div>
        <button class="btn btn-ghost" id="openCart"><i class="fas fa-shopping-cart"></i> Cart (<span id="cartCount">0</span>)</button>
      </div>
    </div>

    <div class="steps">
      <div class="step active" id="stepCart"><i class="fas fa-shopping-cart"></i> Browse</div>
      <div class="step" id="stepPayment"><i class="fas fa-credit-card"></i> Checkout</div>
      <div class="step" id="stepReceipt"><i class="fas fa-receipt"></i> Receipt</div>
    </div>

    <div id="productGrid" class="grid"></div>
  </div>

  <div id="cartSidebar" class="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h2><i class="fas fa-shopping-cart"></i> Your Cart</h2>
      <button class="btn btn-ghost" id="closeCart"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItems"></div>
    <div class="coupon">
      <input type="text" id="couponInput" placeholder="Enter coupon code (SAVE10, LUXE20)">
    </div>
    <div class="cart-summary">
      <div><span>Subtotal:</span> <span id="subtotalText">₹0.00</span></div>
      <div><span>Discount:</span> <span id="discountText">₹0.00</span></div>
      <div class="total"><span>Total:</span> <span id="cartTotal">₹0.00</span></div>
    </div>
    <button class="btn btn-primary" id="checkoutBtn" style="width: 100%; margin-top: 20px;"><i class="fas fa-arrow-right"></i> Proceed to Checkout</button>
    <button class="btn btn-ghost" id="resetCart" style="width: 100%; margin-top: 10px;"><i class="fas fa-trash"></i> Clear Cart</button>
  </div>

  <div id="paymentSection" class="section">
    <h2><i class="fas fa-credit-card"></i> Secure Checkout</h2>
    <div class="form-group">
      <label for="nameInput">Full Name</label>
      <input type="text" id="nameInput" placeholder="Enter your full name">
    </div>
    <div class="form-group">
      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" placeholder="Enter your email">
    </div>
    <div class="summary">
      <div><span>Subtotal:</span> <span id="subtotalText2">₹0.00</span></div>
      <div><span>Discount:</span> <span id="discountText2">₹0.00</span></div>
      <div class="total"><span>Payable Amount:</span> <span id="payableText">₹0.00</span></div>
    </div>
    <button class="btn btn-success" id="payBtn" style="width: 100%;"><i class="fas fa-lock"></i> Complete Payment</button>
    <button class="btn btn-ghost" id="backToCartBtn" style="width: 100%; margin-top: 10px;"><i class="fas fa-arrow-left"></i> Back to Cart</button>
  </div>

  <div id="receiptSection" class="section">
    <div class="success-animation">
      <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--success); margin-bottom: 20px;"></i>
      <h2>Payment Successful!</h2>
      <p style="font-size: 18px; margin-bottom: 30px;">Thank you for your purchase. Your order has been processed.</p>
      <div style="text-align: center; margin-bottom: 30px;">
        <div id="qrcode"></div>
      </div>
      <button class="btn btn-primary" id="newOrderBtn" style="width: 100%;"><i class="fas fa-plus"></i> Start New Shopping</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
  <script>
    // ---------- Product Data ----------
    const PRODUCTS = [
      {id:1, name:"Milton Water Bottle 1L", price:299, tag:"kitchen", img:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600&h=400&fit=crop"},
      {id:2, name:"Slim Fit Jeans", price:899, tag:"fashion", img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=600&h=400&fit=crop"},
      {id:3, name:"Ceramic Flower Pot Set", price:499, tag:"home", img:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=600&h=400&fit=crop"},
      {id:4, name:"Basmati Rice 5kg", price:399, tag:"grocery", img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600&h=400&fit=crop"},
      {id:5, name:"Non-Stick Tawa 28cm", price:599, tag:"kitchen", img:"https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&h=400&fit=crop"},
      {id:6, name:"Cotton Bedsheet Set", price:1299, tag:"home", img:"https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=600&h=400&fit=crop"},
      {id:7, name:"Plastic Storage Box Set", price:799, tag:"home", img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&h=400&fit=crop"},
      {id:8, name:"Stainless Steel Lunch Box", price:449, tag:"kitchen", img:"https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?w=600&h=400&fit=crop"},
      {id:9, name:"Hair Dryer 2000W", price:1199, tag:"appliances", img:"https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&h=400&fit=crop"},
      {id:10, name:"Wireless Mouse", price:599, tag:"electronics", img:"https://images.unsplash.com/photo-1527814050087-3793815479db?w=600&h=400&fit=crop"},
      {id:11, name:"Yoga Mat 6mm", price:699, tag:"fitness", img:"https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=600&h=400&fit=crop"},
      {id:12, name:"Wall Clock Round", price:349, tag:"home", img:"https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=600&h=400&fit=crop"},
    ];

    // ---------- State ----------
    const state = {
      cart: JSON.parse(localStorage.getItem("cart") || "[]"),
      step: "cart",
      coupon: "",
      name: "",
      email: ""
    };

    // ---------- Helpers ----------
    const el = id => document.getElementById(id);
    const formatINR = v => "₹" + v.toFixed(2);
    const saveCart = () => localStorage.setItem("cart", JSON.stringify(state.cart));
    const toast = (msg, type = "success") => {
      const t = el("toast");
      t.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    };
    const setSteps = () => {
      el("stepCart").classList.toggle("active", state.step === "cart");
      el("stepPayment").classList.toggle("active", state.step === "payment");
      el("stepReceipt").classList.toggle("active", state.step === "receipt");
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (state.step === "cart") el("productGrid").style.display = "grid";
      else el("productGrid").style.display = "none";
      if (state.step === "payment") el("paymentSection").classList.add('active');
      if (state.step === "receipt") el("receiptSection").classList.add('active');
    };

    // ---------- Render Products ----------
    function renderProducts(filter = "") {
      const grid = el("productGrid");
      const q = filter.trim().toLowerCase();
      const list = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.tag.toLowerCase().includes(q));
      grid.innerHTML = list.map(p => `
        <div class="card">
          <div class="thumb">
            <img src="${p.img}" alt="${p.name}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="title">${p.name}</div>
            <div class="muted">Category: ${p.tag}</div>
            <div class="price">${formatINR(p.price)}</div>
            <div class="qty-controls">
              <button onclick="changeQty(${p.id}, -1)">−</button>
              <span id="qty-${p.id}">0</span>
              <button onclick="changeQty(${p.id}, 1)">+</button>
            </div>
            <button class="btn btn-primary" onclick="addToCart(${p.id})" style="width: 100%;"><i class="fas fa-plus"></i> Add to Cart</button>
          </div>
        </div>
      `).join("");
      updateQtyDisplays();
    }

    // ---------- Cart Logic ----------
    function addToCart(id) {
      const item = PRODUCTS.find(p => p.id === id);
      const existing = state.cart.find(c => c.id === id);
      if (existing) existing.qty += 1;
      else state.cart.push({ id: item.id, name: item.name, price: item.price, qty: 1, img: item.img });
      saveCart();
      renderCart();
      updateCartCount();
      toast(`${item.name} added to cart`);
    }
    function removeFromCart(id) {
      state.cart = state.cart.filter(c => c.id !== id);
      saveCart();
      renderCart();
      updateCartCount();
      toast("Item removed");
    }
    function changeQty(id, delta) {
      const item = state.cart.find(c => c.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) removeFromCart(id);
        else {
          saveCart();
          renderCart();
          updateCartCount();
        }
      } else {
        // For product cards
        const qtyEl = el(`qty-${id}`);
        let qty = parseInt(qtyEl.textContent) + delta;
        if (qty < 0) qty = 0;
        qtyEl.textContent = qty;
      }
    }
    function cartTotal() {
      return state.cart.reduce((sum, c) => sum + c.price * c.qty, 0);
    }
    function updateCartCount() {
      el("cartCount").textContent = state.cart.reduce((sum, c) => sum + c.qty, 0);
    }
    function renderCart() {
      const items = el("cartItems");
      if (state.cart.length === 0) {
        items.innerHTML = `<div class="muted" style="text-align: center; padding: 40px;">Your cart is empty</div>`;
      } else {
        items.innerHTML = state.cart.map(c => `
          <div class="cart-item">
            <img src="${c.img}" alt="${c.name}">
            <div class="cart-item-details">
              <div class="cart-item-title">${c.name}</div>
              <div class="cart-item-price">${formatINR(c.price)} each</div>
            </div>
            <div class="cart-item-controls">
              <button onclick="changeQty(${c.id}, -1)">−</button>
              <span>${c.qty}</span>
              <button onclick="changeQty(${c.id}, 1)">+</button>
              <button onclick="removeFromCart(${c.id})" style="margin-left: 8px;"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `).join("");
      }
      updateCartSummary();
    }
    function updateCartSummary() {
      const subtotal = cartTotal();
      const coupon = el("couponInput").value.trim().toLowerCase();
      let discount = 0;
      if (coupon === "save10") discount = subtotal * 0.10;
      if (coupon === "luxe20") discount = subtotal * 0.20;
      const total = subtotal - discount;
      el("subtotalText").textContent = formatINR(subtotal);
      el("discountText").textContent = formatINR(discount);
      el("cartTotal").textContent = formatINR(total);
      el("subtotalText2").textContent = formatINR(subtotal);
      el("discountText2").textContent = formatINR(discount);
      el("payableText").textContent = formatINR(total);
    }
    function updateQtyDisplays() {
      state.cart.forEach(c => {
        const qtyEl = el(`qty-${c.id}`);
        if (qtyEl) qtyEl.textContent = c.qty;
      });
    }

    // ---------- Sidebar ----------
    function openCart() { el("cartSidebar").classList.add("open"); }
    function closeCart() { el("cartSidebar").classList.remove("open"); }

    // ---------- Checkout Flow ----------
    function proceedToPayment() {
      if (state.cart.length === 0) { toast("Add items before checkout", "error"); return; }
      state.step = "payment";
      setSteps();
      openCart();
    }
    function backToCart() {
      state.step = "cart";
      setSteps();
      closeCart();
    }
    function pay() {
      const name = el("nameInput").value.trim();
      const email = el("emailInput").value.trim();
      if (!name || !email) { toast("Enter name and email", "error"); return; }
      state.name = name;
      state.email = email;
      state.coupon = el("couponInput").value.trim();

      toast("Processing payment...");
      setTimeout(() => {
        toast("Payment successful!");
        state.step = "receipt";
        setSteps();
        generatePDFReceipt();
        generateQR();
        closeCart();
      }, 2000);
    }
    function newOrder() {
      state.cart = [];
      saveCart();
      state.coupon = "";
      state.name = "";
      state.email = "";
      state.step = "cart";
      setSteps();
      renderCart();
      updateCartCount();
      el("nameInput").value = "";
      el("emailInput").value = "";
      el("couponInput").value = "";
    }

    // ---------- Receipt: PDF + QR ----------
    function generatePDFReceipt() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const total = cartTotal();
      const coupon = state.coupon.trim().toLowerCase();
      let discount = 0;
      if (coupon === "save10") discount = total * 0.10;
      if (coupon === "luxe20") discount = total * 0.20;
      const payable = total - discount;
      const date = new Date().toLocaleString();

      doc.setFontSize(16);
      doc.text('Premium Self-Checkout Receipt', 20, 20);
      doc.setFontSize(12);
      doc.text(`Date: ${date}`, 20, 30);
      doc.text(`Customer: ${state.name}`, 20, 38);
      doc.text(`Email: ${state.email}`, 20, 46);

      let y = 60;
      doc.text('Items:', 20, y); y += 8;
      state.cart.forEach(i => {
        doc.text(`${i.name} x${i.qty} — ${formatINR(i.price * i.qty)}`, 24, y);
        y += 8;
      });
      y += 4;
      doc.text(`Subtotal: ${formatINR(total)}`, 20, y); y += 8;
      doc.text(`Discount: ${formatINR(discount)}`, 20, y); y += 8;
      doc.text(`Total: ${formatINR(payable)}`, 20, y);

      doc.save('premium-receipt.pdf');
    }
    function generateQR() {
      const total = cartTotal();
      const coupon = state.coupon.trim().toLowerCase();
      let discount = 0;
      if (coupon === "save10") discount = total * 0.10;
      if (coupon === "luxe20") discount = total * 0.20;
      const payable = total - discount;
      const date = new Date().toLocaleString();
      const summary = `Name:${state.name}|Email:${state.email}|Total:${payable}|Date:${date}`;

      const qrDiv = el("qrcode");
      qrDiv.innerHTML = "";
      QRCode.toCanvas(document.createElement('canvas'), summary, { width: 200 }, function(err, canvas) {
        if (err) console.error(err);
        else qrDiv.appendChild(canvas);
      });
    }

    // ---------- Theme ----------
    function toggleTheme() {
      const body = document.body;
      const icon = el("toggleTheme").querySelector('i');
      if (body.dataset.theme === "light") {
        body.dataset.theme = "dark";
        icon.className = "fas fa-sun";
      } else {
        body.dataset.theme = "light";
        icon.className = "fas fa-moon";
      }
    }

    // ---------- Events ----------
    el("searchInput").addEventListener("input", e => renderProducts(e.target.value));
    el("openCart").addEventListener("click", openCart);
    el("closeCart").addEventListener("click", closeCart);
    el("checkoutBtn").addEventListener("click", proceedToPayment);
    el("toggleTheme").addEventListener("click", toggleTheme);
    el("resetCart").addEventListener("click", () => {
      state.cart = [];
      saveCart();
      renderCart();
      updateCartCount();
      toast("Cart cleared");
    });
    el("payBtn").addEventListener("click", pay);
    el("backToCartBtn").addEventListener("click", backToCart);
    el("newOrderBtn").addEventListener("click", newOrder);
    el("couponInput").addEventListener("input", updateCartSummary);

    // ---------- Init ----------
    renderProducts();
    renderCart();
    updateCartCount();
    setSteps();

    // Expose for inline handlers
    window.addToCart = addToCart;
    window.removeFromCart = removeFromCart;
    window.changeQty = changeQty;
  </script>
</body>
</html>
